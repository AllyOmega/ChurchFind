# Fly.io. The important line is [mounts]: without a volume the database is inside
# the container filesystem, and every deploy destroys every account.
app = "churchfind"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # Fly terminates TLS in front of the app, so cookies must stay Secure.
  # CHURCHFIND_INSECURE_COOKIES is deliberately absent.

[mounts]
  source = "churchfind_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Cheapest shape: the machine stops when idle and starts again on the next
  # request. You pay for the volume and for the seconds it actually runs. The
  # cost is a cold start of a few seconds on the first request after a quiet
  # spell -- fine for a directory nobody is paging, worth revisiting if it ever
  # gets steady traffic.
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Zero, deliberately. One machine either way: SQLite is a single file on a
  # single volume, and scaling this horizontally needs Postgres or LiteFS first,
  # not another machine.
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"
