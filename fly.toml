# Fly.io. The important line is [mounts]: without a volume the database is inside
# the container filesystem, and every deploy destroys every account.
app = "churchfind"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # Fly terminates TLS in front of the app, so cookies must stay Secure.
  # CHURCHFIND_INSECURE_COOKIES is deliberately absent.

[mounts]
  source = "churchfind_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One machine, because SQLite is a single file on a single volume. Scaling this
  # horizontally needs Postgres or LiteFS first, not another machine.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"
